<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 4 笔记词汇复习闪卡 (含例句)</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-blue: #0284c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 8px 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 闪卡 3D 容器 */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 380px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-front {
            font-size: 3.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-front .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 15px;
            font-weight: normal;
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: flex-start;
            overflow-y: auto;
        }

        .pinyin {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-top: 5px;
            margin-bottom: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meaning {
            font-size: 1.1rem;
            color: var(--text-main);
            padding: 0 10px;
            line-height: 1.3;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* 例句版块样式 */
        .example-box {
            width: 100%;
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            text-align: left;
            margin-top: auto;
            margin-bottom: auto;
        }

        .example-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 6px;
        }

        .example-zh {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .example-py {
            font-size: 0.85rem;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .example-en {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* 语音按钮样式 */
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            padding: 4px 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .audio-btn:hover {
            background-color: #f1f5f9;
        }

        /* 按钮控制区 */
        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn-dont-know {
            background-color: #fee2e2;
            color: var(--accent-red);
        }
        .btn-dont-know:hover {
            background-color: #fecaca;
        }

        .btn-know {
            background-color: #dcfce7;
            color: var(--accent-green);
        }
        .btn-know:hover {
            background-color: #bbf7d0;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 25px;
        }

        .btn-nav {
            background-color: #e2e8f0;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-nav:hover {
            background-color: #cbd5e1;
        }

        /* 错词本区域 */
        .wrong-section {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrong-section h3 {
            margin-top: 0;
            color: var(--accent-red);
            font-size: 1.1rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wrong-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .wrong-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #f8fafc;
            font-size: 0.95rem;
        }

        .wrong-item:hover {
            background-color: #f8fafc;
        }

        .wrong-item span {
            cursor: pointer;
        }

        .remove-wrong {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .remove-wrong:hover {
            color: var(--accent-red);
        }

        .empty-tip {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>HSK 4 课堂笔记复习闪卡</h1>
        <p>点击卡片翻转，查看拼音、释义与双语例句</p>
    </header>

    <div class="container">
        <div class="stats">
            <span id="counter">词语 1 / 106</span>
            <span id="mode-indicator">笔记强化复习</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <!-- 闪卡主体 -->
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="card">
                <div class="card-face card-front">
                    <span id="card-hanzi">看样子</span>
                    <div class="hint">点击卡片查看拼音、释义与例句</div>
                </div>
                <div class="card-face card-back">
                    <div class="pinyin">
                        <span id="card-pinyin">kàn yàngzi</span>
                        <button class="audio-btn" onclick="event.stopPropagation(); playAudio()" title="播放标准发音">🔊</button>
                    </div>
                    <div class="meaning" id="card-meaning">好像 / Kelihatannya, sepertinya</div>
                    
                    <!-- 简短例句展示区 -->
                    <div class="example-box">
                        <div class="example-title">💡 例句 Example</div>
                        <div class="example-zh" id="ex-zh">看样子要下雨了。</div>
                        <div class="example-py" id="ex-py">Kàn yàngzi yào xià yǔ le.</div>
                        <div class="example-en" id="ex-en">It looks like it's going to rain.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 自测操作按钮 -->
        <div class="controls">
            <button class="btn btn-dont-know" onclick="markWrong()">❌ 不会</button>
            <button class="btn btn-know" onclick="markCorrect()">✔️ 认识</button>
        </div>

        <!-- 导航按钮 -->
        <div class="nav-controls">
            <button class="btn-nav" onclick="prevCard()">⬅️ 上一个</button>
            <button class="btn-nav" onclick="nextCard()">下一个 ➡️</button>
        </div>

        <!-- 错词本展示区 -->
        <div class="wrong-section">
            <h3>
                <span>📌 我的错词本 (“不会”的词)</span>
                <span id="wrong-count" style="font-size: 0.85rem; color: var(--text-muted);">0 个词</span>
            </h3>
            <ul class="wrong-list" id="wrongList">
                <div class="empty-tip">暂无错词，继续保持！💪</div>
            </ul>
        </div>
    </div>

    <script>
        // 含有汉字、拼音、印尼文/英文释义及【双语带拼音例句】的完整数据库
        const vocabData = [
            { hanzi: "看样子", pinyin: "kàn yàngzi", meaning: "好像 / Kelihatannya, sepertinya", exZh: "看样子要下雨了。", exPy: "Kàn yàngzi yào xià yǔ le.", exEn: "It looks like it's going to rain." },
            { hanzi: "熟悉", pinyin: "shúxī", meaning: "familiar", exZh: "我对这里很熟悉。", exPy: "Wǒ duì zhèlǐ hěn shúxī.", exEn: "I am very familiar with this place." },
            { hanzi: "旧", pinyin: "jiù", meaning: "used, lama", exZh: "这辆自行车太旧了。", exPy: "Zhè liàng zìxíngchē tài jiù le.", exEn: "This bicycle is too old." },

            { hanzi: "需要", pinyin: "xūyào", meaning: "perlu", exZh: "你需要什么帮助吗？", exPy: "Nǐ xūyào shénme bāngzhù ma?", exEn: "Do you need any help?" },

        function updateCard() {
            const currentItem = vocabData[currentIndex];
            hanziEl.textContent = currentItem.hanzi;
            pinyinEl.textContent = currentItem.pinyin;
            meaningEl.textContent = currentItem.meaning;
            
            exZhEl.textContent = currentItem.exZh;
            exPyEl.textContent = currentItem.exPy;
            exEnEl.textContent = currentItem.exEn;

            // 动态调整正面字号
            if (currentItem.hanzi.length > 4) {
                hanziEl.style.fontSize = "2.2rem";
            } else if (currentItem.hanzi.length > 2) {
                hanziEl.style.fontSize = "2.8rem";
            } else {
                hanziEl.style.fontSize = "3.2rem";
            }

            counterEl.textContent = `词语 ${currentIndex + 1} / ${vocabData.length}`;
            progressEl.style.width = `${((currentIndex + 1) / vocabData.length) * 100}%`;

            cardEl.classList.remove('flipped');
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < vocabData.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert('🎉 恭喜你已经完成全部 106 个带例句词汇的复习！');
                currentIndex = 0;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function markCorrect() {
            nextCard();
        }

        function markWrong() {
            const currentItem = vocabData[currentIndex];
            const exists = wrongWords.some(item => item.hanzi === currentItem.hanzi);
            if (!exists) {
                wrongWords.push(currentItem);
                saveAndRenderWrongList();
            }
            nextCard();
        }

        function removeWrong(index, event) {
            event.stopPropagation();
            wrongWords.splice(index, 1);
            saveAndRenderWrongList();
        }

        function saveAndRenderWrongList() {
            localStorage.setItem('hsk4_notes_wrong_words_v2', JSON.stringify(wrongWords));
            wrongCountEl.textContent = `${wrongWords.length} 个词`;
            
            if (wrongWords.length === 0) {
                wrongListEl.innerHTML = `<div class="empty-tip">暂无错词，继续保持！💪</div>`;
                return;
            }

            wrongListEl.innerHTML = '';
            wrongWords.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'wrong-item';
                li.innerHTML = `
                    <span onclick="jumpToWord('${item.hanzi}')"><strong>${item.hanzi}</strong> (${item.pinyin}) - ${item.meaning}</span>
                    <button class="remove-wrong" onclick="removeWrong(${index}, event)">移出</button>
                `;
                wrongListEl.appendChild(li);
            });
        }

        function jumpToWord(hanzi) {
            const index = vocabData.findIndex(item => item.hanzi === hanzi);
            if (index !== -1) {
                currentIndex = index;
                updateCard();
            }
        }

        function playAudio() {
            const currentItem = vocabData[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // 自动先朗读词语，停顿一下朗读例句
                const textToRead = `${currentItem.hanzi}。 ${currentItem.exZh}`;
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音朗读功能');
            }
        }

        updateCard();
        saveAndRenderWrongList();
